<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {
          // localStorage unavailable (private browsing with strict settings)
        }
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <!--
      The script above is inline on purpose: it sets data-theme before first paint
      (no flash), and an external file would be a render-blocking request. CSP
      allows it by hash, not 'unsafe-inline'. Editing even its whitespace changes
      the hash: the build then fails and prints the script-src to paste into
      netlify.toml (scripts/csp.ts). Keep it in step with src/hooks/useTheme.ts.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Title, description, canonical, og:* and JSON-LD are written per route by the
      `seo` plugin in vite.config.ts (src/seo/site.ts). Do not add them here: a
      second description tag would ship next to the generated one.
    -->
    <!--seo:head-->
    <!--
      Analytics: the umami tracker <script> and its preconnect <link> are injected
      here at build time by the `inject-umami` plugin in vite.config.ts. That plugin
      only fires for a production build outside a Netlify preview context, so
      `vite dev`, `--mode development` builds, deploy-previews and branch-deploys all
      stay out of the production stats. The tracker itself is vendored at
      public/umami.js and served same-origin; only the collected data leaves for the
      VPS. Custom events live in src/lib/analytics.ts.
    -->
  </head>
  <body>
    <div id="root"><!--seo:shell--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
