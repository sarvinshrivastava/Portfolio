<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      Blocking on purpose: sets data-theme before first paint so the static shell
      below (and the app) never flashes the wrong theme. Same-origin, so the CSP
      script-src 'self' allows it. Mirrors useTheme's initial state.
    -->
    <script src="/theme.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Title, description, canonical, og:* and JSON-LD are written per route by the
      `seo` plugin in vite.config.ts (src/seo/site.ts). Do not add them here: a
      second description tag would ship next to the generated one.
    -->
    <!--seo:head-->
    <!--
      Analytics: the umami tracker <script> and its preconnect <link> are injected
      here at build time by the `inject-umami` plugin in vite.config.ts. That plugin
      only fires for a production build outside a Netlify preview context, so
      `vite dev`, `--mode development` builds, deploy-previews and branch-deploys all
      stay out of the production stats. The tracker itself is vendored at
      public/umami.js and served same-origin; only the collected data leaves for the
      VPS. Custom events live in src/lib/analytics.ts.
    -->
  </head>
  <body>
    <div id="root"><!--seo:shell--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
